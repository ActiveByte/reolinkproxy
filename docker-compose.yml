services:
  reolinkproxy:
    build: .
    image: reolinkproxy:latest
    container_name: reolinkproxy
    restart: unless-stopped
    # Host networking is recommended: WS-Discovery (multicast), Reolink UID discovery
    # (UDP broadcast), and each camera's own auto-assigned ONVIF port (see
    # SERVER_ONVIF_BASE_PORT below) all need it. Comment this out and use the "ports"
    # block instead only if you can't use host networking.
    network_mode: host
    # ports:
    #   - "8554:8554/tcp" # RTSP
    #   - "8000:8000/udp" # RTP
    #   - "8001:8001/udp" # RTCP
    #   - "3702:3702/udp" # ONVIF WS-Discovery
    #   - "8080:8080/tcp" # Web UI
    #   - "8102-8110:8102-8110/tcp" # Per-camera ONVIF (base_port..base_port+N cameras-1; widen range for more cameras)
    volumes:
      # Persists cameras added/edited/removed through the web UI across container
      # recreation. Add your camera(s) via the web UI at :8080 after the first start.
      - ./config.yml:/config.yml
    environment:
      # advertise_host, onvif username/password, and everything else besides cameras live
      # in config.yml (see the volume above) - edit that file directly, no env vars needed.
      - REOLINK_CONFIG_FILE=/config.yml
    healthcheck:
      test: ["CMD", "/usr/local/bin/reolinkproxy", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
