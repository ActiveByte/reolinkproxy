services:
  reolinkproxy:
    build: .
    image: reolinkproxy:latest
    container_name: reolinkproxy
    restart: unless-stopped
    # Host networking is recommended: WS-Discovery (multicast), Reolink UID discovery
    # (UDP broadcast), and each camera's own auto-assigned ONVIF port (see
    # SERVER_ONVIF_BASE_PORT below) all need it. Comment this out and use the "ports"
    # block instead only if you can't use host networking.
    network_mode: host
    # ports:
    #   - "8554:8554/tcp" # RTSP
    #   - "8000:8000/udp" # RTP
    #   - "8001:8001/udp" # RTCP
    #   - "3702:3702/udp" # ONVIF WS-Discovery
    #   - "8080:8080/tcp" # Web UI
    #   - "8102-8110:8102-8110/tcp" # Per-camera ONVIF (base_port..base_port+N cameras-1; widen range for more cameras)
    volumes:
      # Mount a directory, not the file directly: the container runs as non-root (uid
      # 65532) and writes config.yml atomically via a temp file in the same directory, so
      # that directory must be writable by uid 65532 (e.g. `chown -R 65532:65532 ./data`
      # on the host once before first start). Persists cameras added/edited/removed
      # through the web UI across container recreation - add your camera(s) via the web
      # UI at :8080 after the first start.
      - ./data:/data
    # advertise_host, onvif username/password, and everything else besides cameras live in
    # /data/config.yml (see the volume above, defaulted via REOLINK_CONFIG_FILE in the
    # image) - edit that file directly, no env vars needed.
    healthcheck:
      test: ["CMD", "/usr/local/bin/reolinkproxy", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
