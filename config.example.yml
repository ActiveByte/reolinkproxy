mqtt:
  broker: "tcp://10.0.0.21:1883"
  username: ""
  password: ""
  topic: "reolinkproxy"

server:
  rtsp_address: ":8554"
  rtp_address: ":8000"
  rtcp_address: ":8001"
  # First port used to auto-assign each camera's own ONVIF server (base port + camera
  # index) - camera 0 gets 8102, camera 1 gets 8103, etc., unless a camera sets onvif_port
  # explicitly below.
  onvif_base_port: 8102
  advertise_host: "" # Optional: specify host IP to advertise in ONVIF/RTSP
  log_packets: false

onvif:
  username: "admin"
  password: "admin"